name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0284c7&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0284c7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0c3a55,#0e5a85,#1e88c7,#38bdf8

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
